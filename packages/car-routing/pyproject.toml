[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "car-routing"
version = "0.1.0"
description = "Travel time and distance by car from 2GIS, including a point-to-point matrix"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/car_routing"]

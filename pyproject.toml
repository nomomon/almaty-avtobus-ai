[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "car-routing-2gis"
version = "0.1.0"
description = "Travel time and distance by car from 2GIS, including a point-to-point matrix"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "pydantic>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["car_routing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
